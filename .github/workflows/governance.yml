name: Verify governed public source

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: windows-latest
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"
          package-manager-cache: false

      - name: Verify repository identity, projection allowlist, version, and secrets
        shell: pwsh
        run: npm run governance:check -- --expected-role public-projection --require-clean

      - name: Verify assembled frontend source
        shell: pwsh
        run: npm run frontend:check

      - name: Check projected standalone JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # frontend-src contains ordered fragments of one classic script; each
          # fragment is intentionally not a standalone JavaScript program.
          $files = @(git ls-files "*.js" "*.mjs" | Where-Object { $_ -notlike "frontend-src/*" })
          foreach ($file in $files) {
            & node --check $file
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
          }

      - name: Check self-contained public build prerequisites
        shell: pwsh
        run: node .github/scripts/release-contract.mjs check-source

      - name: Classify source changes
        id: scope
        shell: pwsh
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = "Stop"
          $sourceChanged = $true
          if ($env:BASE_COMMIT -match '^[0-9a-f]{40}$' -and $env:BASE_COMMIT -notmatch '^0+$') {
            $paths = @(& git diff --name-only $env:BASE_COMMIT HEAD)
            if ($LASTEXITCODE -ne 0) { throw "Unable to classify changed source paths" }
            $sourceChanged = @($paths | Where-Object {
              $_ -notmatch '^(README\.md|SOURCE_CODE\.md|PUBLIC_PROJECTION\.json|\.github/release-notes/[^/]+\.md)$'
            }).Count -gt 0
          }
          "source_changed=$($sourceChanged.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install the stable Rust MSVC toolchain
        if: steps.scope.outputs.source_changed == 'true'
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Unable to install Rust toolchain" }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Unable to select Rust toolchain" }

      - name: Build native helpers for public protocol tests
        if: steps.scope.outputs.source_changed == 'true'
        shell: pwsh
        run: npm run launcher:build

      - name: Test the complete public source before tagging
        if: steps.scope.outputs.source_changed == 'true'
        shell: pwsh
        run: npm test

      - name: Reject whitespace errors
        shell: pwsh
        run: git diff --check HEAD^
