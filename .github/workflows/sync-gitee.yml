name: Sync release assets to Gitee
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步到 Gitee 的 GitHub Release 标签，例如 v0.9.8"
        required: true
        type: string
jobs:
  sync:
    # Gitee 的大文件附件上传在 GitHub-hosted Windows runner 的部分出口
    # 上会长时间无响应；Ubuntu runner 使用另一条网络出口，作为默认同步路径。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Fetch published assets from GitHub Release into dist/
        shell: bash
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo AETAVK/linli-local-mail --dir dist --clobber
          echo "已从 GitHub Release ${TAG} 取回以下产物："
          ls -l dist
        env:
          TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }}
      - name: Run Gitee publish script
        shell: pwsh
        run: node .github/scripts/publish-gitee-release.mjs
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: sforlife/linli-local-mail
          GITEE_RELEASE_TAG: ${{ github.event.inputs.tag }}
          GITEE_TARGET_COMMIT: ${{ github.event.inputs.tag }}
          GITEE_ALLOW_VERSION_MISMATCH: "1"
