name: Build and publish GitHub release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的版本标签，例如 v0.9.6"
        required: true
        type: string
      source_ref:
        description: "可选：用于修复既有标签的源码分支或提交；日常重跑留空"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js for build scripts
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"

      - name: Validate release tag and package version
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:DISPATCH_TAG
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release 标签必须符合 v<major>.<minor>.<patch>：$tag"
          }
          if ($tag -ne "v$version") {
            throw "标签 $tag 与 package.json 版本 $version 不一致"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building $tag from commit $env:GITHUB_SHA"

      - name: Install the stable Rust MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @("server.mjs", "frontend/local-mail-poc.js") + @(Get-ChildItem -LiteralPath src -Filter "*.mjs" -File | ForEach-Object FullName)
          foreach ($file in $files) {
            & node --check $file
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
          }

      - name: Smoke test installer extractor (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\installer-smoke.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 installer smoke test failed" }

      - name: Smoke test installer extractor (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & pwsh.exe -NoProfile -ExecutionPolicy Bypass -File ".github\scripts\installer-smoke.ps1"
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 installer smoke test failed" }

      - name: Build installer and verify runtime allowlist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run installer:build
          if ($LASTEXITCODE -ne 0) { throw "installer:build failed" }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION
          $installer = Join-Path "dist" "LinliLocalMail-$version-Setup.exe"
          $hashFile = "$installer.sha256"
          $manifestFile = "$installer.json"
          $certificate = Join-Path "dist" "LinliLocalMail-SelfSigned.cer"
          foreach ($path in @($installer, $hashFile, $manifestFile, $certificate)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release artifact: $path" }
          }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared = ((Get-Content -Raw -LiteralPath $hashFile).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $declared) { throw "SHA-256 sidecar does not match installer" }
          $manifest = Get-Content -Raw -LiteralPath $manifestFile | ConvertFrom-Json
          if ($actual -ne ([string]$manifest.installerSha256).ToLowerInvariant()) { throw "Manifest SHA-256 does not match installer" }
          Write-Host "Installer SHA-256: $actual"
          Write-Host "Installer size: $((Get-Item -LiteralPath $installer).Length) bytes"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $notesFile = ".github/release-notes/v$version.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "缺少版本专属 Release 说明：$notesFile"
          }
          $notes = (Get-Content -Raw -LiteralPath $notesFile).Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "版本专属 Release 说明不能为空：$notesFile"
          }
          $installer = "dist/LinliLocalMail-$version-Setup.exe"
          $assets = @(
            $installer,
            "$installer.sha256",
            "$installer.json",
            "dist/LinliLocalMail-SelfSigned.cer"
          )
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            & gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Linli Local Mail $version" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release notes update failed" }
            & gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Linli Local Mail $version" --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publish failed" }
