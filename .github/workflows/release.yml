name: Build and publish verified release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布或幂等核对的既有标签，例如 v0.11.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: verified-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js for build scripts
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.1"
          package-manager-cache: false

      - name: Validate tag, version, and checked-out commit
        id: identity
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $env:DISPATCH_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release 标签必须符合 v<major>.<minor>.<patch>：$tag" }
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw "标签 $tag 与 package.json 版本 $version 不一致" }

          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0) { throw "无法读取 checkout HEAD" }
          $tagCommit = (& git rev-list -n 1 $tag).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -notmatch '^[0-9a-f]{40}$') { throw "无法解析标签提交：$tag" }
          if ($head -ne $tagCommit) { throw "checkout HEAD $head 与标签提交 $tagCommit 不一致" }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_COMMIT=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install the stable Rust MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version

      - name: Build native helpers for protocol tests
        shell: pwsh
        run: npm run launcher:build

      - name: Check standalone JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(git ls-files "*.js" "*.mjs" | Where-Object { $_ -notlike "frontend-src/*" })
          foreach ($file in $files) {
            & node --check $file
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
          }

      - name: Verify governed public projection
        shell: pwsh
        run: npm run governance:check -- --expected-role public-projection --require-clean

      - name: Verify assembled frontend source
        shell: pwsh
        run: npm run frontend:check

      - name: Run final candidate tests once
        shell: pwsh
        run: npm test

      - name: Require the stable signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.LINLI_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.LINLI_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "正式发布必须配置 LINLI_SIGNING_PFX_BASE64；禁止使用临时自签名证书"
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            throw "正式发布必须配置 LINLI_SIGNING_PFX_PASSWORD"
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "linli-release-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "LINLI_SIGNING_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LINLI_SIGNING_PFX_PASSWORD=$($env:SIGNING_PFX_PASSWORD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer and runtime allowlist
        shell: pwsh
        # Stay in PowerShell 7: npm's Windows PowerShell entry writes a BOM in JSON metadata.
        run: ./tools/build-installer.ps1

      - name: Render and verify the single final release body
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION
          $notes = ".github/release-notes/v$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "缺少版本专属 Release 说明：$notes" }
          & node .github/scripts/release-contract.mjs prepare `
            --version $version `
            --tag $env:RELEASE_TAG `
            --source-commit $env:SOURCE_COMMIT `
            --root . `
            --notes $notes `
            --body-output dist/release-body.md `
            --receipt-output dist/release-receipt.json
          if ($LASTEXITCODE -ne 0) { throw "发布正文或收据生成失败" }

      - name: Preserve the verified release bundle for audit
        uses: actions/upload-artifact@v6
        with:
          name: verified-release-${{ env.RELEASE_TAG }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/LinliLocalMail-${{ env.RELEASE_VERSION }}-Setup.exe
            dist/LinliLocalMail-${{ env.RELEASE_VERSION }}-Setup.exe.sha256
            dist/LinliLocalMail-${{ env.RELEASE_VERSION }}-Setup.exe.json
            dist/LinliLocalMail-SelfSigned.cer
            dist/release-body.md
            dist/release-receipt.json

      - name: Publish one immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $bodyFile = "dist/release-body.md"
          $receiptFile = "dist/release-receipt.json"
          $installer = "dist/LinliLocalMail-$version-Setup.exe"
          $assets = @($installer, "$installer.sha256", "$installer.json", "dist/LinliLocalMail-SelfSigned.cer")
          $expected = Get-Content -Raw -LiteralPath $receiptFile | ConvertFrom-Json

          function Save-ReleaseMetadata([string]$destination) {
            & gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,body,assets,targetCommitish,url |
              Out-File -LiteralPath $destination -Encoding utf8NoBOM
            if ($LASTEXITCODE -ne 0) { throw "无法读取 GitHub Release 元数据：$tag" }
          }

          function Assert-DraftMetadata([string]$metadataPath) {
            $remote = Get-Content -Raw -LiteralPath $metadataPath | ConvertFrom-Json
            if ($remote.tagName -ne $tag -or -not $remote.isDraft -or $remote.isPrerelease) { throw "GitHub draft 状态或标签异常" }
            $normalizedBody = (([string]$remote.body -replace "`r`n", "`n" -replace "`r", "`n").TrimEnd() + "`n")
            $bytes = [Text.UTF8Encoding]::new($false).GetBytes($normalizedBody)
            $remoteBodyHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            if ($remoteBodyHash -ne [string]$expected.bodySha256) { throw "GitHub draft 正文与最终正文不一致" }
            $remoteAssets = @($remote.assets)
            if ($remoteAssets.Count -ne 4) { throw "GitHub draft 必须恰好包含四个发布附件" }
            foreach ($asset in @($expected.assets)) {
              $matches = @($remoteAssets | Where-Object { $_.name -eq $asset.name })
              if ($matches.Count -ne 1) { throw "GitHub draft 附件缺失或重名：$($asset.name)" }
              if ([int64]$matches[0].size -ne [int64]$asset.size) { throw "GitHub draft 附件大小不一致：$($asset.name)" }
              $digest = [string]$matches[0].digest
              if (-not [string]::IsNullOrWhiteSpace($digest) -and $digest.ToLowerInvariant() -ne "sha256:$($asset.sha256)") {
                throw "GitHub draft 附件摘要不一致：$($asset.name)"
              }
            }
          }

          function Assert-PublishedRelease([string]$metadataPath, [string]$verificationRoot) {
            $remote = Get-Content -Raw -LiteralPath $metadataPath | ConvertFrom-Json
            if ($remote.isDraft -or $remote.isPrerelease) { throw "GitHub Release 尚未正式发布" }
            $downloadRoot = Join-Path $verificationRoot "dist"
            New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
            foreach ($asset in @($expected.assets)) {
              & gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $downloadRoot --pattern $asset.name --clobber
              if ($LASTEXITCODE -ne 0) { throw "下载 GitHub Release 附件失败：$($asset.name)" }
            }
            $remoteReceipt = Join-Path $verificationRoot "release-receipt.json"
            $remoteBody = Join-Path $verificationRoot "release-body.md"
            & node .github/scripts/release-contract.mjs extract-github `
              --metadata $metadataPath `
              --root $verificationRoot `
              --body-output $remoteBody `
              --receipt-output $remoteReceipt `
              --source-commit $env:SOURCE_COMMIT
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release 远端复核失败" }
            $expectedHash = (Get-FileHash -LiteralPath $receiptFile -Algorithm SHA256).Hash
            $remoteHash = (Get-FileHash -LiteralPath $remoteReceipt -Algorithm SHA256).Hash
            if ($expectedHash -ne $remoteHash) { throw "已发布 GitHub Release 与本次构建收据不一致；必须发布新版本" }
          }

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $metadataPath = Join-Path $env:RUNNER_TEMP "github-release-$version.json"
          if ($exists) {
            Save-ReleaseMetadata $metadataPath
            $existing = Get-Content -Raw -LiteralPath $metadataPath | ConvertFrom-Json
            if (-not $existing.isDraft) {
              Assert-PublishedRelease $metadataPath (Join-Path $env:RUNNER_TEMP "linli-published-$version")
              Write-Host "GitHub Release $tag 已存在且与发布收据完全一致；幂等结束。"
              exit 0
            }
            & gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Linli Local Mail $version" --notes-file $bodyFile --draft
            if ($LASTEXITCODE -ne 0) { throw "更新 GitHub draft 正文失败" }
            & gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "上传 GitHub draft 附件失败；draft 保持未公开" }
          } else {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "Linli Local Mail $version" --notes-file $bodyFile
            if ($LASTEXITCODE -ne 0) { throw "创建 GitHub draft 失败" }
            & gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "上传 GitHub draft 附件失败；draft 保持未公开" }
          }

          Save-ReleaseMetadata $metadataPath
          Assert-DraftMetadata $metadataPath
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "发布 GitHub draft 失败" }
          Save-ReleaseMetadata $metadataPath
          Assert-PublishedRelease $metadataPath (Join-Path $env:RUNNER_TEMP "linli-published-$version")

  gitee-release:
    needs: github-release
    uses: ./.github/workflows/sync-gitee.yml
    with:
      tag: ${{ needs.github-release.outputs.release_tag }}
    secrets:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
