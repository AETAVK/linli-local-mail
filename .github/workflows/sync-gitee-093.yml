name: Sync v0.9.3 to Gitee (one-off)
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published assets from GitHub Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          gh release download v0.9.3 --repo AETAVK/linli-local-mail --dir dist --clobber
          Get-ChildItem dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run Gitee publish script
        shell: pwsh
        run: node .github/scripts/publish-gitee-release.mjs
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: sforlife/linli-local-mail
          GITEE_RELEASE_TAG: v0.9.3
          GITEE_TARGET_COMMIT: v0.9.3
